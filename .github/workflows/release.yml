# Publishes a release: pushing a tag `vX.Y.Z` on main builds the Linux packages and the Windows
# installers through the `linux` and `windows` workflows (the same builds, tests and smoke tests
# CI runs) and attaches them, with their SHA-256 sums, to a GitHub release of that name. Either
# build failing stops the release.
#
# The tag must match the version in `src-tauri/Cargo.toml` and `src-tauri/tauri.conf.json`;
# the version moves by a PR first, the tag follows the merge (README, "Releasing").
# While the version is 0.x the release is marked a pre-release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag $tag, Cargo.toml $cargo, tauri.conf.json $tauri"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$tauri" ] || { echo "the tag and the version differ"; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag is not on main"; exit 1; }

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      updates: true
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      updates: true
    secrets: inherit

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: konstruct-linux
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: konstruct-windows
          path: bundle-windows

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          find bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} dist/ \;
          find bundle-windows -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

          {
            echo "Konstruct for Linux and Windows, $TAG."
            echo
            echo "| Package | For |"
            echo "|---|---|"
            echo "| \`.deb\` | Ubuntu, Linux Mint, Debian: \`sudo apt install ./Konstruct_*.deb\` |"
            echo "| \`.rpm\` | Fedora, openSUSE: \`sudo dnf install ./Konstruct-*.rpm\` |"
            echo "| \`.AppImage\` | any distribution: \`chmod +x Konstruct_*.AppImage\` and run it |"
            echo "| \`_x64-setup.exe\` | Windows 10 and 11: run it (installs for this user) |"
            echo "| \`.msi\` | Windows, for installing through policy or for all users |"
            echo
            echo "The Windows installers are not signed yet: SmartScreen warns — **More info → Run anyway**."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\` (on Windows: \`certutil -hashfile <file> SHA256\` and compare)."
            echo
            echo "Built from (Linux, then Windows):"
            echo '```'
            cat bundle/siblings.txt
            echo
            cat bundle-windows/siblings.txt
            echo '```'
          } > notes.md

          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Konstruct $TAG" \
            --notes-file notes.md --verify-tag $pre

      # The feed the installed copies read once a day (src-tauri/src/update.rs): a fixed
      # pre-release, as `releases/latest` does not see pre-releases; its `latest.json` is
      # replaced by each release. Only the packages are signed; a feed naming a file whose
      # signature does not check against the key in the app installs nothing.
      - name: Update feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          one() { n=$(cd dist && ls $1); [ "$(echo "$n" | wc -l)" = 1 ] && [ -f "dist/$n.sig" ] || { echo "no single signed $1" >&2; exit 1; }; echo "$n"; }
          appimage=$(one '*.AppImage'); nsis=$(one '*-setup.exe'); msi=$(one '*.msi')
          entry() { jq -n --arg url "$base/$1" --rawfile sig "dist/$1.sig" '{url: $url, signature: $sig}'; }
          jq -n --arg v "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson appimage "$(entry "$appimage")" --argjson nsis "$(entry "$nsis")" --argjson msi "$(entry "$msi")" \
            '{version: $v, pub_date: $date, platforms: {
               "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage,
               "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi }}' > latest.json
          cat latest.json
          gh release view update-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create update-feed --repo "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Update feed" --notes "What installed copies read to find a new version. Not a release: the packages are on the vX.Y.Z releases."
          gh release upload update-feed latest.json --repo "$GITHUB_REPOSITORY" --clobber
