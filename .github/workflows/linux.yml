# Builds Konstruct for Linux: tests, clippy, and the deb / rpm / AppImage installers.
#
# The crates take construct-client, construct-core and construct-protos by path, so they are
# checked out beside this repository, as on a developer's machine (AGENTS.md, "Checkouts").
# Until the dependencies are git ones (TODO 218, stage 5) a build here uses those repositories'
# main branches as they are at the time of the run — so it runs without `--locked`: the sibling
# crates' versions move with their main, and the lockfile follows them in the runner only. A
# breaking change on a sibling's main shows here first.
#
# A pull request gets clippy, the tests and the program started from a debug build; the
# installers (a release build, the slow part), the key-store check and the smoke test of the
# installed package run on main, by hand and for a release.
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      client-ref:
        description: "construct-client branch or commit to build against"
        default: main
  # The release workflow builds through this one, so a release is the same build CI checks.
  workflow_call:
    inputs:
      # A release: sign the update files with the updater key, and fail without it.
      updates:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The oldest supported runner: an AppImage runs on systems with a glibc at least as new.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: construct-desktop
      - uses: actions/checkout@v4
        with:
          repository: konstruct-msg/construct-client
          ref: ${{ inputs.client-ref || 'main' }}
          path: construct-client
      - uses: actions/checkout@v4
        with:
          repository: konstruct-msg/construct-core
          path: construct-core
      - uses: actions/checkout@v4
        with:
          repository: konstruct-msg/construct-protos
          path: construct-protos

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libasound2-dev pkg-config patchelf file rpm

      # Ubuntu's protoc (3.12) predates proto3 `optional`, which the protos use.
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust toolchain
        working-directory: construct-desktop
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # Compiled dependencies only, not this workspace's own crates; saved from main alone, so
      # pull requests reuse it instead of each adding a copy (the repository has 10 GB).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          workspaces: |
            construct-desktop -> target
            construct-client -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        working-directory: construct-desktop
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: construct-desktop
        run: cargo test --workspace

      # target/ comes back from the cache with the previous run's packages in it; without this the
      # artifact, the smoke test and a release would pick up an older version beside the new one.
      - name: Installers
        if: github.event_name != 'pull_request'
        working-directory: construct-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf target/release/bundle
          if [ "${{ inputs.updates }}" = true ]; then
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "a release needs the updater key"; exit 1; }
            # The updater's signature beside each self-updating package (src/update.rs).
            npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage
          fi

      # The store key in Secret Service: the client's keyring round trip, against a real
      # gnome-keyring in a D-Bus session. Ignored in ordinary runs because it writes to the key store.
      - name: Secret Service
        if: github.event_name != 'pull_request'
        working-directory: construct-client
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test -p construct-client --lib -- --ignored the_os_key_store
          '

      # In a pull request: the debug build starts and keeps running — a panic at startup or a
      # webview that cannot come up ends it before the timeout.
      - name: Smoke test (debug build)
        if: github.event_name == 'pull_request'
        working-directory: construct-desktop
        run: |
          cargo build -p construct-desktop
          sudo apt-get install -y --no-install-recommends xvfb
          export HOME="$(mktemp -d)" RUST_LOG=info
          code=0
          timeout 20 dbus-run-session -- xvfb-run -a ./target/debug/konstruct-desktop > smoke.log 2>&1 || code=$?
          tail -n 30 smoke.log
          if grep -qi panicked smoke.log; then exit 1; fi
          [ "$code" = 124 ] || { echo "konstruct-desktop exited with $code before the timeout"; exit 1; }

      # The installed package starts and keeps running: a missing library, a panic at startup or
      # a webview that cannot come up ends it before the timeout.
      - name: Smoke test
        if: github.event_name != 'pull_request'
        working-directory: construct-desktop
        run: |
          sudo apt-get install -y --no-install-recommends xvfb ./target/release/bundle/deb/*.deb
          export HOME="$(mktemp -d)" RUST_LOG=info
          code=0
          timeout 20 dbus-run-session -- xvfb-run -a konstruct-desktop > smoke.log 2>&1 || code=$?
          tail -n 30 smoke.log
          if grep -qi panicked smoke.log; then exit 1; fi
          [ "$code" = 124 ] || { echo "konstruct-desktop exited with $code before the timeout"; exit 1; }

      # The siblings are path dependencies on their main (see the top of this file), so the
      # commits a build used are recorded next to it; the release notes carry them.
      - name: Sibling commits
        if: github.event_name != 'pull_request'
        run: |
          for r in construct-desktop construct-client construct-core construct-protos; do
            echo "$r $(git -C $r rev-parse HEAD)"
          done | tee construct-desktop/target/release/bundle/siblings.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: konstruct-linux
          path: |
            construct-desktop/target/release/bundle/siblings.txt
            construct-desktop/target/release/bundle/deb/*.deb
            construct-desktop/target/release/bundle/rpm/*.rpm
            construct-desktop/target/release/bundle/appimage/*.AppImage
            construct-desktop/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
