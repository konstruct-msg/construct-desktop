<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Konstruct</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The logo, as iOS has it (KonstructLogo): one shape, coloured by where it stands -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="logo-mark" viewBox="0 0 1024 1024">
      <path fill="currentColor" d="M 720.2 228.7 C 659.8 228.7 606.9 295.7 577.8 396 C 567 433.1 514.7 435.4 500.5 399.4 L 433.3 228.7 C 402.8 150.2 356.2 100 303.9 100 C 211.8 100 137.2 255.7 137.2 447.7 C 137.2 639.7 211.8 795.4 303.9 795.4 C 330.4 795.4 355.5 782.4 377.7 759.3 L 379.7 757.3 C 447.5 692.9 558.4 717.8 594 803.7 C 624.6 877.4 669.7 924 720.1 924 C 812.1 924 886.7 768.3 886.7 576.3 C 886.7 384.2 812.1 228.5 720.1 228.5 Z M 720.2 228.7"/>
    </symbol>
  </svg>

  <!-- Starting: restoring the session -->
  <section id="screen-starting" class="screen centered" hidden>
    <div class="column">
      <svg class="logo accent" aria-hidden="true"><use href="#logo-mark"/></svg>
      <div class="wordmark" data-t="appTitle"></div>
      <p class="dim" data-t="starting"></p>
    </div>
  </section>

  <!-- Onboarding -->
  <section id="screen-onboarding" class="screen centered" hidden>
    <form class="column" id="onboarding-form">
      <svg class="logo large" aria-hidden="true"><use href="#logo-mark"/></svg>
      <div class="wordmark" data-t="appTitle"></div>
      <p class="dim tagline" data-t="tagline"></p>
      <input id="alias" class="field" autocomplete="off" spellcheck="false" data-tp="aliasPlaceholder">
      <button type="submit" class="primary" data-t="createIdentity"></button>
      <button type="button" class="link" id="go-link" data-t="linkThisDevice"></button>
      <button type="button" class="link small dim" id="veil-start-open" data-t="veilNoAccess"></button>
      <div id="veil-start" class="veil-start" hidden>
        <p class="small dim" data-t="veilStartHint"></p>
        <textarea id="veil-start-link" class="field mono small" rows="3" spellcheck="false" data-tp="veilLinkPlaceholder"></textarea>
        <div class="row">
          <button type="button" class="secondary" id="veil-start-connect" data-t="veilConnect"></button>
          <button type="button" class="link small" id="veil-start-off" data-t="veilDisconnect" hidden></button>
        </div>
        <p id="veil-start-state" class="small" hidden></p>
      </div>
      <button type="button" class="link small dim save-logs" data-t="saveLogs"></button>
    </form>
  </section>

  <!-- Registering -->
  <section id="screen-registering" class="screen centered" hidden>
    <div class="column">
      <div class="wordmark" data-t="appTitle"></div>
      <p id="reg-label" class="dim"></p>
      <div class="progress"><div id="reg-bar"></div></div>
      <p class="dim small" data-t="registeringHint"></p>
    </div>
  </section>

  <!-- Linking: the phone scans this -->
  <section id="screen-link" class="screen centered" hidden>
    <div class="column">
      <h1 class="title" data-t="linkTitle"></h1>
      <p class="dim" data-t="linkHint"></p>
      <div class="qr-frame"><img id="link-qr" alt="" hidden><div id="link-wait" class="dim small" data-t="making"></div></div>
      <p id="link-error" class="error" hidden></p>
      <p class="small dim" id="link-copy-hint" data-t="linkCopyHint" hidden></p>
      <div class="row">
        <button type="button" id="link-copy" class="secondary" data-t="copyCode" hidden></button>
        <button type="button" id="link-retry" class="secondary" data-t="newCode" hidden></button>
        <button type="button" id="link-back" class="secondary" data-t="back"></button>
      </div>
    </div>
  </section>

  <!-- Passphrase: unlock, or protect a new account where there is no OS key store -->
  <section id="screen-passphrase" class="screen centered" hidden>
    <form class="column" id="passphrase-form">
      <div class="wordmark" data-t="appTitle"></div>
      <p id="passphrase-hint" class="dim"></p>
      <input id="passphrase" type="password" class="field" autocomplete="current-password">
      <button type="submit" class="primary" id="passphrase-submit"></button>
      <button type="button" class="link small dim save-logs" data-t="saveLogs"></button>
    </form>
  </section>

  <!-- The app lock: over everything, while the window is locked -->
  <section id="lock-screen" class="lock-screen centered" hidden>
    <form class="column" id="lock-form">
      <svg class="logo accent huge" aria-hidden="true"><use href="#logo-mark"/></svg>
      <div class="wordmark" data-t="appTitle"></div>
      <p class="dim" data-t="lockHint"></p>
      <input id="lock-code" type="password" class="field" autocomplete="off">
      <p id="lock-error" class="error small" hidden></p>
      <button type="submit" class="primary" data-t="unlock"></button>
      <button type="button" class="danger-link" id="lock-forgot" data-t="lockForgot"></button>
    </form>
  </section>

  <!-- Main: chats and the open conversation -->
  <section id="screen-main" class="screen main" hidden>
    <aside class="sidebar">
      <header class="sidebar-head">
        <span class="sidebar-title" data-t="chats"></span>
        <button type="button" class="icon" id="add-contact" data-tl="addContact">
          <svg viewBox="0 0 24 24"><path d="M15 19c0-2.8-2.7-5-6-5s-6 2.2-6 5M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M19 8v6M16 11h6"/></svg>
        </button>
      </header>
      <input id="chat-search" class="search" type="search" spellcheck="false" data-tp="search">
      <ul id="chat-list" class="chat-list" role="listbox"></ul>
      <footer class="sidebar-foot">
        <span id="connection" class="dot" data-tl="offline"></span>
        <button type="button" class="link small" id="open-settings" data-t="settings"></button>
      </footer>
    </aside>
    <main class="detail">
      <div id="empty" class="empty">
        <svg viewBox="0 0 24 24" class="hero"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM19 9h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4"/></svg>
        <h2 class="headline" data-t="selectChat"></h2>
        <p class="dim" data-t="selectChatHint"></p>
        <button type="button" class="secondary" id="empty-add" data-t="addContact"></button>
      </div>
      <div id="chat" class="chat" hidden>
        <header class="toolbar">
          <span id="chat-avatar"></span>
          <span id="chat-name" class="headline"></span>
          <span class="spacer"></span>
          <button type="button" class="icon" id="chat-info" data-tl="profile">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </button>
        </header>
        <div id="alarm" class="alarm" role="alert" hidden>
          <span id="alarm-text"></span>
          <button type="button" class="link" id="alarm-compare" data-t="compareSafety"></button>
        </div>
        <div id="transcript" class="transcript" tabindex="-1"></div>
        <div id="compose-bar" class="compose-bar" hidden>
          <div class="compose-what"><span id="compose-label" class="label"></span><span id="compose-text" class="text"></span></div>
          <button type="button" class="icon" id="compose-cancel" data-tl="cancel">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <form id="composer" class="composer">
          <button type="button" class="attach icon" id="attach" data-tl="attach" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>
          </button>
          <input type="file" id="attach-file" hidden>
          <input type="file" id="attach-photo" accept="image/*,video/*" hidden>
          <textarea id="draft" rows="1" data-tp="messagePlaceholder"></textarea>
          <button type="submit" class="send" id="send" data-tl="send" disabled hidden>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"/></svg>
          </button>
          <!-- With nothing typed, as on iOS: a voice note -->
          <button type="button" class="mic icon" id="mic" data-tl="recordVoice">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          </button>
        </form>
        <div id="recorder" class="recorder" hidden>
          <button type="button" class="icon" id="voice-cancel" data-tl="cancel">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <span class="rec-dot" aria-hidden="true"></span>
          <span id="voice-time" class="voice-time">0:00</span>
          <div id="voice-live" class="voice-bars live" aria-hidden="true"></div>
          <button type="button" class="send" id="voice-send" data-tl="send">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"/></svg>
          </button>
        </div>
      </div>
    </main>
  </section>

  <div id="msg-menu" class="msg-menu" role="menu" hidden></div>

  <!-- What "+" opens, as on iOS: stickers, or a photo or a file from this computer -->
  <div id="picker" class="picker" role="dialog" data-tl="attach" hidden>
    <div id="picker-stickers" class="picker-body"></div>
    <nav class="picker-tabs">
      <button type="button" class="tab" aria-selected="true" data-t="stickers"></button>
      <button type="button" class="tab" id="picker-photo" data-t="photoOrVideo"></button>
      <button type="button" class="tab" id="picker-file" data-t="fileEllipsis"></button>
    </nav>
  </div>

  <!-- Add contact -->
  <dialog id="dlg-add" class="sheet">
    <h2 class="headline" data-t="addContact"></h2>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" data-tab="paste" data-t="pasteInvite"></button>
      <button type="button" class="tab" data-tab="myqr" data-t="myQr"></button>
    </div>
    <div class="tab-pane" data-pane="paste">
      <form id="find-form" class="row">
        <input id="find-query" class="field grow" spellcheck="false" autocomplete="off" data-tp="findPlaceholder">
        <button type="submit" class="primary" data-t="find"></button>
      </form>
      <ul id="find-results" class="results"></ul>
    </div>
    <div class="tab-pane" data-pane="myqr" hidden>
      <p class="dim small" data-t="myQrHint"></p>
      <div class="qr-frame"><img id="invite-qr" alt="" hidden><div id="invite-wait" class="dim small" data-t="making"></div></div>
      <div class="row">
        <button type="button" class="secondary" id="invite-copy" data-t="copyLink"></button>
        <button type="button" class="secondary" id="invite-new" data-t="newCode"></button>
      </div>
    </div>
    <div class="row end"><button type="button" class="secondary" data-close data-t="close"></button></div>
  </dialog>

  <!-- Contact info and safety number -->
  <dialog id="dlg-info" class="sheet">
    <div class="row"><span id="info-avatar"></span><h2 id="info-name" class="headline"></h2></div>
    <p class="mono small dim" id="info-id"></p>
    <form class="row field-row" id="alias-form">
      <input class="field" id="alias-input" autocomplete="off" maxlength="50">
      <button type="submit" class="secondary" data-t="saveUsername"></button>
    </form>
    <p class="small dim" data-t="aliasHint"></p>
    <label class="toggle"><input type="checkbox" id="info-share"><span data-t="shareProfile"></span></label>
    <p class="small dim" data-t="shareProfileHint"></p>
    <h3 class="section" data-t="safetyNumbers"></h3>
    <p class="small" id="info-hint"></p>
    <div id="safety" class="safety mono"></div>
    <div class="row end">
      <button type="button" class="danger-link" id="info-delete" data-t="deleteChat"></button>
      <span class="spacer"></span>
      <button type="button" class="secondary" data-close data-t="close"></button>
    </div>
  </dialog>

  <!-- Settings: sections on the left, the chosen one on the right -->
  <dialog id="dlg-settings" class="sheet settings">
    <nav class="settings-nav" id="settings-nav">
      <h2 class="headline" data-t="settings"></h2>
      <button type="button" data-pane="profile" data-t="profile"></button>
      <button type="button" data-pane="devices" data-t="devices"></button>
      <button type="button" data-pane="chats" data-t="chatsAndLook"></button>
      <button type="button" data-pane="privacy" data-t="notificationsAndPrivacy"></button>
      <button type="button" data-pane="veil" data-t="veil"></button>
      <button type="button" data-pane="storage" data-t="dataAndStorage"></button>
      <button type="button" data-pane="recovery" data-t="recoveryKey"></button>
      <button type="button" data-pane="diagnostics" data-t="diagnostics"></button>
      <button type="button" data-pane="about" data-t="about"></button>
      <span class="spacer"></span>
      <button type="button" class="danger-link" id="sign-out" data-t="signOut"></button>
    </nav>
    <div class="settings-body">
      <section class="settings-pane" data-pane="profile">
        <h3 class="section" data-t="profile"></h3>
        <div class="profile-head">
          <div id="set-avatar"></div>
          <div>
            <div class="profile-name" id="set-name"></div>
            <div class="dim" id="set-username"></div>
            <div class="small dim mono" id="set-user"></div>
          </div>
        </div>
        <div class="photo-row">
          <button type="button" class="secondary" id="avatar-choose" data-t="choosePhoto"></button>
          <button type="button" class="link" id="avatar-remove" data-t="removePhoto"></button>
          <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        </div>
        <h3 class="section" data-t="displayName"></h3>
        <form class="row field-row" id="name-form">
          <input class="field" id="name-input" autocomplete="off" maxlength="50" data-tp="displayNamePlaceholder">
          <button type="submit" class="secondary" data-t="saveUsername"></button>
        </form>
        <p class="small dim" data-t="profileHint"></p>
        <h3 class="section" data-t="usernameSection"></h3>
        <form class="row field-row" id="username-form">
          <input class="field" id="username-input" autocomplete="off" spellcheck="false" maxlength="21" data-tp="usernamePlaceholder">
          <button type="submit" class="secondary" data-t="saveUsername"></button>
        </form>
        <p class="small dim" data-t="usernameHint"></p>
        <label class="toggle"><input type="checkbox" id="set-discoverable"><span data-t="discoverable"></span></label>
        <p class="small dim" id="discoverable-hint"></p>
        <dl class="facts">
          <dt data-t="accountId"></dt><dd class="mono copyable" id="set-account-id" data-tl="clickToCopy"></dd>
          <dt data-t="fingerprint"></dt><dd class="mono copyable" id="set-fingerprint" data-tl="clickToCopy"></dd>
          <dt data-t="deviceId"></dt><dd class="mono" id="set-device"></dd>
        </dl>
        <p class="small dim" data-t="fingerprintHint"></p>
        <h3 class="section danger" data-t="dangerZone"></h3>
        <div class="row">
          <button type="button" class="secondary" id="sign-out-everywhere" data-t="signOutEverywhere"></button>
          <button type="button" class="danger-button" id="delete-account" data-t="deleteAccount"></button>
        </div>
        <p class="small dim" data-t="signOutEverywhereHint"></p>
      </section>
      <section class="settings-pane" data-pane="devices" hidden>
        <h3 class="section" data-t="devices"></h3>
        <h3 class="section" data-t="thisDeviceName"></h3>
        <form class="row field-row" id="device-name-form">
          <input class="field" id="device-name-input" autocomplete="off" maxlength="40">
          <button type="submit" class="secondary" data-t="saveUsername"></button>
        </form>
        <p class="small dim" data-t="deviceNameHint"></p>
        <h3 class="section" data-t="allDevices"></h3>
        <ul class="devices" id="set-devices"></ul>
        <div class="row"><button type="button" class="secondary" id="revoke-others" data-t="revokeOthers"></button></div>
        <h3 class="section" data-t="historyTransfer"></h3>
        <p class="small dim" data-t="historyTransferHint"></p>
        <div class="row">
          <button type="button" class="secondary" id="history-import" data-t="historyImport"></button>
          <input type="file" id="history-file" hidden>
        </div>
        <div class="row" id="history-nearby" hidden>
          <span class="small" id="history-nearby-text"></span>
          <button type="button" class="link" id="history-nearby-cancel" data-t="cancel"></button>
        </div>
        <h3 class="section" data-t="linkDevice"></h3>
        <div class="row"><button type="button" class="secondary" id="offer-link" data-t="showLinkCode"></button></div>
        <p class="small dim" data-t="showLinkCodeHint"></p>
        <form class="row field-row" id="approve-form">
          <input class="field mono" id="approve-input" autocomplete="off" spellcheck="false" data-tp="approvePlaceholder">
          <button type="submit" class="secondary" data-t="approve"></button>
        </form>
        <p class="small dim" data-t="approveHint"></p>
      </section>
      <section class="settings-pane" data-pane="chats" hidden>
        <h3 class="section" data-t="appearance"></h3>
        <div class="row choice" id="theme-choice">
          <button type="button" class="tab" data-theme-choice="system" data-t="themeSystem"></button>
          <button type="button" class="tab" data-theme-choice="dark" data-t="themeDark"></button>
          <button type="button" class="tab" data-theme-choice="light" data-t="themeLight"></button>
        </div>
        <h3 class="section" data-t="textSize"></h3>
        <div class="row choice" data-pref="textSize">
          <button type="button" class="tab" data-value="compact" data-t="textCompact"></button>
          <button type="button" class="tab" data-value="standard" data-t="textStandard"></button>
          <button type="button" class="tab" data-value="large" data-t="textLarge"></button>
        </div>
        <h3 class="section" data-t="language"></h3>
        <div class="row choice" data-pref="lang">
          <button type="button" class="tab" data-value="auto" data-t="langAuto"></button>
          <button type="button" class="tab" data-value="ru">Русский</button>
          <button type="button" class="tab" data-value="en">English</button>
        </div>
        <h3 class="section" data-t="chatsSection"></h3>
        <label class="toggle"><input type="checkbox" data-pref-flag="sendOnEnter"><span data-t="sendOnEnter"></span></label>
        <p class="small dim" data-t="sendOnEnterHint"></p>
        <label class="toggle"><input type="checkbox" data-pref-flag="showTimes"><span data-t="showTimes"></span></label>
      </section>
      <section class="settings-pane" data-pane="veil" hidden>
        <h3 class="section" data-t="veil"></h3>
        <p class="small dim" data-t="veilHint"></p>
        <div class="row choice" id="veil-mode">
          <button type="button" class="tab" data-value="off" data-t="veilOff"></button>
          <button type="button" class="tab" data-value="auto" data-t="veilAuto"></button>
          <button type="button" class="tab" data-value="on" data-t="veilOn"></button>
        </div>
        <p id="veil-state" class="small"></p>
        <h3 class="section" data-t="veilAddLink"></h3>
        <p class="small dim" data-t="veilAddLinkHint"></p>
        <textarea id="veil-link" class="field mono small" rows="3" spellcheck="false" data-tp="veilLinkPlaceholder"></textarea>
        <div class="row"><button type="button" class="secondary" id="veil-import" data-t="veilImport"></button></div>
        <h3 class="section" data-t="veilVoucher"></h3>
        <p class="small dim" data-t="veilVoucherHint"></p>
        <div class="row"><button type="button" class="secondary" id="veil-voucher" data-t="veilVoucherMake"></button></div>
        <div id="veil-voucher-out" hidden>
          <textarea id="veil-voucher-link" class="field mono small" rows="3" readonly></textarea>
          <p id="veil-voucher-exp" class="small dim"></p>
          <div class="row"><button type="button" class="secondary" id="veil-voucher-copy" data-t="copy"></button></div>
        </div>
      </section>
      <section class="settings-pane" data-pane="privacy" hidden>
        <h3 class="section" data-t="notifications"></h3>
        <label class="toggle"><input type="checkbox" data-pref-flag="notify"><span data-t="notifyOn"></span></label>
        <div class="previews" data-pref="preview">
          <button type="button" class="tab" data-value="nameAndMessage"><b data-t="previewNameAndMessage"></b><span class="small dim" data-t="previewNameAndMessageHint"></span></button>
          <button type="button" class="tab" data-value="nameOnly"><b data-t="previewNameOnly"></b><span class="small dim" data-t="previewNameOnlyHint"></span></button>
          <button type="button" class="tab" data-value="none"><b data-t="previewNone"></b><span class="small dim" data-t="previewNoneHint"></span></button>
        </div>
        <h3 class="section" data-t="privacy"></h3>
        <label class="toggle"><input type="checkbox" id="set-receipts"><span data-t="deliveryReceipts"></span></label>
        <p class="small dim" data-t="deliveryReceiptsHint"></p>
        <h3 class="section" data-t="appLock"></h3>
        <p class="small" id="lock-status"></p>
        <div class="row choice" id="lock-delay">
          <button type="button" class="tab" data-value="0" data-t="lockNowDelay"></button>
          <button type="button" class="tab" data-value="60" data-t="lock1m"></button>
          <button type="button" class="tab" data-value="300" data-t="lock5m"></button>
          <button type="button" class="tab" data-value="900" data-t="lock15m"></button>
          <button type="button" class="tab" data-value="3600" data-t="lock1h"></button>
        </div>
        <p class="small dim" data-t="lockDelayHint"></p>
        <form class="column-form" id="lock-set-form">
          <input type="password" class="field" id="lock-current" autocomplete="off" data-tp="lockCurrent">
          <input type="password" class="field" id="lock-new" autocomplete="off" data-tp="lockNew">
          <input type="password" class="field" id="lock-repeat" autocomplete="off" data-tp="lockRepeat">
          <div class="row">
            <button type="submit" class="secondary" id="lock-save"></button>
            <button type="button" class="secondary" id="lock-now" data-t="lockNow"></button>
            <button type="button" class="danger-link" id="lock-off" data-t="lockOff"></button>
          </div>
        </form>
        <p class="small dim" data-t="lockScreenHint"></p>
        <h3 class="section" data-t="issuedInvites"></h3>
        <ul class="devices" id="set-invites"></ul>
        <div class="row"><button type="button" class="secondary" id="revoke-invites" data-t="revokeAllInvites"></button></div>
        <p class="small dim" data-t="issuedInvitesHint"></p>
      </section>
      <section class="settings-pane" data-pane="storage" hidden>
        <h3 class="section" data-t="mediaCache"></h3>
        <p id="cache-usage"></p>
        <div class="meter" id="cache-meter"><span></span></div>
        <div class="row"><button type="button" class="secondary" id="cache-clear" data-t="clearCache"></button></div>
        <p class="small dim" data-t="clearCacheHint"></p>
        <h3 class="section" data-t="autoDownload"></h3>
        <div class="row choice" data-media="autoDownload">
          <button type="button" class="tab" data-value="never" data-t="autoNever"></button>
          <button type="button" class="tab" data-value="small" data-t="autoSmall"></button>
          <button type="button" class="tab" data-value="always" data-t="autoAlways"></button>
        </div>
        <p class="small dim" data-t="autoDownloadHint"></p>
        <h3 class="section" data-t="cacheLimit"></h3>
        <div class="row choice" data-media="cacheLimit">
          <button type="button" class="tab" data-value="268435456" data-bytes></button>
          <button type="button" class="tab" data-value="536870912" data-bytes></button>
          <button type="button" class="tab" data-value="1073741824" data-bytes></button>
          <button type="button" class="tab" data-value="2147483648" data-bytes></button>
          <button type="button" class="tab" data-value="5368709120" data-bytes></button>
          <button type="button" class="tab" data-value="0" data-t="noLimit"></button>
        </div>
        <p class="small dim" data-t="cacheLimitHint"></p>
        <h3 class="section" data-t="keepMedia"></h3>
        <div class="row choice" data-media="keepDays">
          <button type="button" class="tab" data-value="0" data-t="keepForever"></button>
          <button type="button" class="tab" data-value="7" data-t="keep7"></button>
          <button type="button" class="tab" data-value="30" data-t="keep30"></button>
          <button type="button" class="tab" data-value="90" data-t="keep90"></button>
        </div>
        <p class="small dim" data-t="keepMediaHint"></p>
      </section>
      <section class="settings-pane" data-pane="recovery" hidden>
        <h3 class="section" data-t="recoveryKey"></h3>
        <p id="recovery-status" class="small"></p>
        <div class="row">
          <button type="button" class="secondary" id="recovery-show" data-t="makeCopy" hidden></button>
          <button type="button" class="secondary" id="recovery-enter" data-t="enterPhrase" hidden></button>
        </div>
      </section>
      <section class="settings-pane" data-pane="about" hidden>
        <h3 class="section" data-t="about"></h3>
        <dl class="facts">
          <dt data-t="version"></dt><dd class="mono" id="set-version"></dd>
          <dt data-t="connectionLabel"></dt><dd id="set-connection"></dd>
          <dt data-t="server"></dt><dd class="mono" id="set-server"></dd>
        </dl>
        <h3 class="section" data-t="update"></h3>
        <p class="small" id="update-state"></p>
        <div class="row wrap">
          <button type="button" class="primary" id="update-install" data-t="updateInstall" hidden></button>
          <button type="button" class="secondary" id="update-page" data-t="updatePage" hidden></button>
          <button type="button" class="secondary" id="update-check" data-t="updateCheck"></button>
        </div>
      </section>
      <section class="settings-pane" data-pane="diagnostics" hidden>
        <h3 class="section" data-t="diagnostics"></h3>
        <p class="small dim" data-t="diagnosticsHint"></p>
        <dl class="facts">
          <dt data-t="logs"></dt><dd class="mono small" id="set-logs"></dd>
          <dt data-t="logsSize"></dt><dd id="logs-size"></dd>
        </dl>
        <div class="row wrap">
          <button type="button" class="primary save-logs" data-t="saveLogs"></button>
          <button type="button" class="secondary" id="open-logs" data-t="openLogs"></button>
          <button type="button" class="secondary" id="clear-logs" data-t="clearLogs"></button>
        </div>
        <h3 class="section" data-t="recentLogs"></h3>
        <pre class="log-tail" id="logs-recent"></pre>
      </section>
      <div class="row end"><button type="button" class="secondary" data-close data-t="close"></button></div>
    </div>
  </dialog>

  <!-- Recovery phrase: its copy, or typing it on a device that did not make it -->
  <dialog id="dlg-recovery" class="sheet">
    <h2 class="headline" data-t="recoveryKey"></h2>
    <div class="recovery-pane" data-pane="words">
      <p class="small" data-t="copyHint"></p>
      <ol id="recovery-words" class="words mono"></ol>
      <div class="row end">
        <button type="button" class="secondary" data-close data-t="later"></button>
        <button type="button" class="primary" id="recovery-written" data-t="writtenDown"></button>
      </div>
    </div>
    <form class="recovery-pane" data-pane="quiz" id="recovery-quiz" hidden>
      <p class="small" data-t="quizHint"></p>
      <div id="recovery-questions" class="questions"></div>
      <p id="recovery-quiz-error" class="error small" hidden></p>
      <div class="row end">
        <button type="button" class="secondary" id="recovery-back" data-t="back"></button>
        <button type="submit" class="primary" data-t="check"></button>
      </div>
    </form>
    <form class="recovery-pane" data-pane="enter" id="recovery-enter-form" hidden>
      <p class="small" data-t="enterHint"></p>
      <textarea id="recovery-phrase" class="field phrase mono" rows="3" spellcheck="false" autocomplete="off"></textarea>
      <p id="recovery-enter-error" class="error small" hidden></p>
      <div class="row end">
        <button type="button" class="secondary" data-close data-t="close"></button>
        <button type="submit" class="primary" data-t="save"></button>
      </div>
    </form>
  </dialog>

  <!-- A code a new device scans to join this account (Flow A) -->
  <dialog id="dlg-link-offer" class="sheet">
    <h2 class="headline" data-t="linkDevice"></h2>
    <p class="small" data-t="offerHint"></p>
    <div class="qr-frame"><img id="offer-qr" alt="" hidden><div id="offer-wait" class="dim small" data-t="making"></div></div>
    <p id="offer-status" class="small dim"></p>
    <p id="offer-error" class="error small" hidden></p>
    <div class="row end">
      <button type="button" class="secondary" id="offer-retry" data-t="newCode" hidden></button>
      <button type="button" class="secondary" id="offer-close" data-t="cancel"></button>
    </div>
  </dialog>

  <!-- Deleting the account: a countdown that can be stopped, as on iOS -->
  <dialog id="dlg-delete" class="sheet">
    <h2 class="headline" data-t="deleteAccount"></h2>
    <p class="small" data-t="deleteAccountWarning"></p>
    <p id="delete-error" class="error small" hidden></p>
    <div class="row end">
      <button type="button" class="link" id="delete-local" data-t="deleteLocally" hidden></button>
      <button type="button" class="secondary" id="delete-cancel" data-t="cancel"></button>
      <button type="button" class="danger-button" id="delete-go" data-t="deleteAccount"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="main.js"></script>
</body>
</html>
