<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construct</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 16px; }
      .row { display: flex; gap: 12px; align-items: center; }
      textarea { width: 100%; height: 120px; }
      button { padding: 8px 12px; cursor: pointer; }
      pre { background: #f6f6f6; padding: 12px; border-radius: 8px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Construct (MVP)</h1>

    <div class="row">
      <button id="btnStatus">Get status</button>
      <button id="btnLogin">Login (device-based)</button>
    </div>

    <h3>Status</h3>
    <pre id="statusOut"></pre>

    <hr />

    <h3>Chats</h3>
    <div id="chatsOut" style="display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;"></div>

    <h3>Chat Thread</h3>

    <div class="row" style="gap:8px;">
      <input id="chatIdInput" placeholder="chat_id (recipient user_id)" style="flex:1;padding:8px;" />
      <button id="btnLoadChat">Load</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <textarea id="composer" placeholder="Type message..."></textarea>
    </div>

    <div class="row">
      <button id="btnSend">Send text</button>
    </div>

    <pre id="messagesOut" style="min-height:200px;"></pre>

    <script>
      function invoke(command, args) {
        if (window.__TAURI__ && window.__TAURI__.invoke) {
          return window.__TAURI__.invoke(command, args);
        }
        if (window.tauri && window.tauri.invoke) {
          return window.tauri.invoke(command, args);
        }
        return Promise.reject(new Error("Tauri invoke API not found"));
      }

      let selectedChatId = null;

      async function loadStatus() {
        const out = document.getElementById("statusOut");
        try {
          const res = await invoke("get_app_status");
          out.textContent = JSON.stringify(res, null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      }

      async function fetchChats() {
        const chatsOut = document.getElementById("chatsOut");
        const list = await invoke("list_chats");
        chatsOut.innerHTML = "";
        if (!Array.isArray(list) || list.length === 0) {
          chatsOut.textContent = "No chats yet. Wait for incoming messages or send after login.";
          return;
        }
        list.forEach((c) => {
          const el = document.createElement("div");
          el.style.border = "1px solid #ddd";
          el.style.borderRadius = "8px";
          el.style.padding = "10px";
          el.style.cursor = "pointer";
          el.textContent = `${c.title} (${c.chat_id})${c.last_message ? " — " + c.last_message : ""}`;
          el.addEventListener("click", () => {
            selectedChatId = c.chat_id;
            document.getElementById("chatIdInput").value = selectedChatId;
            loadChatThread();
          });
          chatsOut.appendChild(el);
        });
      }

      async function loadChatThread() {
        const chatId = selectedChatId || document.getElementById("chatIdInput").value.trim();
        if (!chatId) return;
        const out = document.getElementById("messagesOut");
        const messages = await invoke("list_messages", { chat_id: chatId });
        out.textContent = JSON.stringify(messages, null, 2);
      }

      document.getElementById("btnStatus").addEventListener("click", loadStatus);

      document.getElementById("btnLogin").addEventListener("click", async () => {
        const out = document.getElementById("statusOut");
        out.textContent = "Logging in...";
        try {
          await invoke("ensure_authenticated", { username: null });
          await loadStatus();
          await fetchChats();
          await loadChatThread();
        } catch (e) {
          out.textContent = String(e);
        }
      });

      document.getElementById("btnLoadChat").addEventListener("click", async () => {
        selectedChatId = document.getElementById("chatIdInput").value.trim();
        await loadChatThread();
      });

      document.getElementById("btnSend").addEventListener("click", async () => {
        const out = document.getElementById("statusOut");
        const chatId = document.getElementById("chatIdInput").value.trim();
        const text = document.getElementById("composer").value;
        if (!chatId || !text) {
          out.textContent = "Enter both chat_id and message text.";
          return;
        }
        try {
          const res = await invoke("send_text", { chat_id: chatId, text });
          out.textContent = "send_text result:\\n" + JSON.stringify(res, null, 2);
          document.getElementById("composer").value = "";
          await fetchChats();
          await loadChatThread();
        } catch (e) {
          out.textContent = String(e);
        }
      });

      async function refreshLoop() {
        try {
          await loadStatus();
          await fetchChats();
          if (selectedChatId || document.getElementById("chatIdInput").value.trim()) {
            await loadChatThread();
          }
        } catch {}
      }

      loadStatus();
      setInterval(refreshLoop, 4000);
    </script>
  </body>
</html>
