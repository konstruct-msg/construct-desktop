[package]
name = "construct-desktop"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Konstruct for Linux and Windows: the construct-client layer in a Tauri window"

[[bin]]
name = "konstruct-desktop"
path = "src/main.rs"

[features]
default = ["post-quantum"]
post-quantum = ["construct-client/post-quantum"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything the program is, from the construct-client repository checked out next to this one.
# This crate adds the window and the interface (decisions/desktop-web-interface.md).
construct-client = { path = "../../construct-client/crates/construct-client" }

tauri = { version = "2", features = [] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zeroize = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# The system's notifications: D-Bus on Linux, toasts on Windows. Not on macOS, which is not a
# target here (its build would ask for an app bundle at the first notification).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
serde_json = "1"
