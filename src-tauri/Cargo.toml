[package]
name = "construct-desktop"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Konstruct for Linux and Windows: the construct-client layer and its screens in a Tauri window"

[[bin]]
name = "konstruct-desktop"
path = "src/main.rs"

[features]
default = ["post-quantum"]
post-quantum = ["construct-client/post-quantum", "construct-screens/post-quantum"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything the program is, and the screens it shows, from the construct-client repository
# checked out next to this one (decisions/desktop-is-the-tui-client-with-a-second-shell.md).
# The same screens the terminal shell draws; this crate adds only the window.
construct-client = { path = "../../construct-client/crates/construct-client" }
construct-screens = { path = "../../construct-client/crates/construct-screens" }

tauri = { version = "2", features = [] }
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
