[package]
name = "construct-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
directories = "5.0"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto core
construct-core = { path = "../construct-core", features = ["desktop"] }

# Tauri
tauri = { version = "2.1", features = [] }

# gRPC / protobuf
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

# Secure storage (Linux)
keyring = "3.6"
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12"

